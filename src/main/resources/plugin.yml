
name: LegacySpawnerBankTest
version: 0.1.0
main: com.legacysmp.spawnerbank.LegacySpawnerBankTest
api-version: '1.21'
softdepend: [WildStacker]

commands:
  lsbdebug:
    description: Diagnostic test for WildStacker spawner counts.
    usage: /lsbdebug
    permission: legacybank.admin

permissions:
  legacybank.admin:
    description: Allows use of the Legacy Spawner Bank diagnostic command.
    default: op
